<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7"><!-- via JS, folgt dem App-Theme -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FOS">
  <title>FOS Dashboard</title>
  <style>
/* =========================================================================
   FOS Dashboard – style.css
   Apple-artige, ruhige Produktivitäts-Optik. Hell + Dark Mode.
   Eine dezente Akzentfarbe. Rot/Gelb ausschließlich für Fristen.
   ========================================================================= */

/* ---------- Design Tokens ---------- */
:root {
  color-scheme: light;

  --bg:          #f5f5f7;
  --surface:     #ffffff;
  --surface-2:   #fbfbfd;
  --surface-hi:  #ffffff;
  --border:      rgba(0, 0, 0, 0.08);
  --border-2:    rgba(0, 0, 0, 0.06);
  --shadow-sm:   0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow-md:   0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-pop:  0 12px 40px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.10);

  --text:        #1d1d1f;
  --text-2:      #6e6e73;
  --text-3:      #8e8e93;

  --accent:      #0071e3;
  --accent-press:#0064c8;
  --accent-soft: rgba(0, 113, 227, 0.10);
  --accent-line: rgba(0, 113, 227, 0.22);

  /* Fristen – nur hierfür Gelb/Rot */
  --warn:        #a8720a;
  --warn-soft:   rgba(214, 152, 12, 0.14);
  --danger:      #d70015;
  --danger-soft: rgba(215, 0, 21, 0.10);
  --ok:          #1c8a3c;

  --radius:      16px;
  --radius-sm:   11px;
  --radius-lg:   22px;

  --sidebar-w:   248px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Segoe UI", "Inter", system-ui, Roboto, Helvetica, Arial, sans-serif;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --bg:          #131315;
  --surface:     #1e1e20;
  --surface-2:   #262628;
  --surface-hi:  #2a2a2c;
  --border:      rgba(255, 255, 255, 0.09);
  --border-2:    rgba(255, 255, 255, 0.06);
  --shadow-sm:   0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md:   0 4px 18px rgba(0, 0, 0, 0.45);
  --shadow-pop:  0 16px 48px rgba(0, 0, 0, 0.6);

  --text:        #f5f5f7;
  --text-2:      #a1a1a6;
  --text-3:      #8a8a8f;

  --accent:      #0a84ff;
  --accent-press:#409cff;
  --accent-soft: rgba(10, 132, 255, 0.16);
  --accent-line: rgba(10, 132, 255, 0.34);

  --warn:        #e0a83c;
  --warn-soft:   rgba(224, 168, 60, 0.16);
  --danger:      #ff453a;
  --danger-soft: rgba(255, 69, 58, 0.15);
  --ok:          #34c759;
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select, button { font-family: inherit; font-size: 15px; color: var(--text); }
h1, h2, h3, h4, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-soft); }

/* ---------- App Shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 22px 14px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 40;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 6px 10px 18px;
}
.brand-mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: linear-gradient(160deg, var(--accent), var(--accent-press));
  display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 15px;
  box-shadow: var(--shadow-sm);
  flex: none;
}
.brand-name { font-weight: 600; letter-spacing: -0.01em; }
.brand-sub  { font-size: 12px; color: var(--text-3); margin-top: 1px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border: none;
  background: transparent;
  border-radius: 10px;
  color: var(--text-2);
  font-size: 14.5px;
  font-weight: 500;
  width: 100%;
  text-align: left;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item .ico { width: 19px; height: 19px; flex: none; opacity: 0.9; }
.nav-item.active .ico { opacity: 1; }
.nav-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  display: grid; place-items: center;
  background: var(--danger-soft);
  color: var(--danger);
}
.sidebar-foot { margin-top: auto; padding: 8px 12px 0; }
.storage-mini { font-size: 11.5px; color: var(--text-3); }

/* ---------- Main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 34px;
  padding-top: max(18px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.8) blur(20px);
  -webkit-backdrop-filter: saturate(1.8) blur(20px);
  border-bottom: 1px solid var(--border-2);
}
.hamburger {
  display: none;
  width: 38px; height: 38px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 10px;
  color: var(--text);
  align-items: center; justify-content: center;
  flex: none;
}
.head-titles { display: flex; flex-direction: column; min-width: 0; }
.head-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.head-date { font-size: 13px; color: var(--text-2); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
.pill-today {
  font-size: 11px; font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px; border-radius: 20px;
}

.search {
  margin-left: auto;
  position: relative;
  width: min(320px, 40vw);
}
.search input {
  width: 100%;
  height: 38px;
  padding: 0 14px 0 38px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  outline: none;
  transition: border 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.search input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.search .s-ico {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-3); pointer-events: none;
}
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  display: grid; place-items: center;
  flex: none;
  transition: color 0.15s var(--ease), background 0.15s var(--ease);
}
.icon-btn:hover { color: var(--text); background: var(--surface-2); }

.view {
  padding: 26px 34px 60px;
  padding-bottom: max(60px, env(safe-area-inset-bottom));
  max-width: 1180px;
  width: 100%;
}

/* ---------- Page header ---------- */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; }
.page-sub { font-size: 13.5px; color: var(--text-2); margin-top: 3px; }

.section-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  margin: 26px 2px 12px;
  letter-spacing: -0.01em;
}
.section-label:first-child { margin-top: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 16px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  transition: transform 0.08s var(--ease), background 0.15s var(--ease), border 0.15s var(--ease);
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(0.975); }
.btn .ico { width: 17px; height: 17px; }
.btn.primary {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}
.btn.primary:hover { background: var(--accent-press); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn.block { width: 100%; justify-content: center; }

/* ---------- Cards ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  gap: 15px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 17px 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s var(--ease), transform 0.12s var(--ease), border 0.2s var(--ease);
}
.card.interactive { cursor: pointer; }
.card.interactive:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--border); }
.card-head {
  display: flex; align-items: center; gap: 9px;
  margin-bottom: 12px;
}
.card-head .ico { width: 18px; height: 18px; color: var(--text-3); }
.card-title { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.card-title .n { color: var(--text-3); font-weight: 500; }

.stat { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.stat-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

/* Listen in Karten */
.mini-list { display: flex; flex-direction: column; gap: 2px; margin: -4px -6px; }
.mini-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px;
  border-radius: 9px;
  transition: background 0.12s var(--ease);
}
.mini-row.click { cursor: pointer; }
.mini-row.click:hover { background: var(--surface-2); }
.mini-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.mini-dot.ok { background: var(--ok); }
.mini-dot.accent { background: var(--accent); }
.mini-main { min-width: 0; flex: 1; }
.mini-t { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-t.done { text-decoration: line-through; color: var(--text-3); }
.mini-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-side { font-size: 12px; font-weight: 600; color: var(--text-2); flex: none; }

/* Fristen-Chips */
.due {
  font-size: 11.5px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px;
  background: var(--surface-2); color: var(--text-2);
  white-space: nowrap;
}
.due.warn { background: var(--warn-soft); color: var(--warn); }
.due.danger { background: var(--danger-soft); color: var(--danger); }
.due.over { background: var(--danger-soft); color: var(--danger); }

.tag {
  font-size: 11.5px; font-weight: 500;
  padding: 2px 9px; border-radius: 20px;
  background: var(--surface-2); color: var(--text-2);
}
.tag.accent { background: var(--accent-soft); color: var(--accent); }

/* ---------- Aufgaben-/Listen-Zeilen (volle Breite) ---------- */
.rows { display: flex; flex-direction: column; gap: 9px; }
.row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 13px 15px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s var(--ease), border 0.18s var(--ease);
}
.row:hover { box-shadow: var(--shadow-md); }
.row.overdue { border-color: var(--danger-soft); }
.check {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  border: 1.8px solid var(--border);
  background: transparent;
  display: grid; place-items: center;
  color: transparent;
  transition: all 0.15s var(--ease);
}
.check:hover { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.check .ico { width: 13px; height: 13px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-title.done { text-decoration: line-through; color: var(--text-3); }
.row-meta { font-size: 12.5px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-end { display: flex; align-items: center; gap: 8px; flex: none; }
.thumb-count {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text-3);
}
.thumb-count .ico { width: 14px; height: 14px; }

/* ---------- Empty ---------- */
.empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--text-3);
}
.empty .ico { width: 30px; height: 30px; margin-bottom: 10px; opacity: 0.5; }
.empty p { font-size: 14px; }
.empty .sub { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ---------- Kalender ---------- */
.cal-day { margin-bottom: 22px; }
.cal-day-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-2);
}
.cal-day-name { font-size: 15px; font-weight: 600; }
.cal-day-date { font-size: 12.5px; color: var(--text-3); }
.cal-day.is-today .cal-day-name { color: var(--accent); }
.cal-event {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 4px;
}
.cal-time { font-size: 12.5px; color: var(--text-3); width: 46px; flex: none; font-variant-numeric: tabular-nums; }
.cal-bar { width: 3px; align-self: stretch; border-radius: 3px; background: var(--accent); flex: none; }
.cal-bar.task { background: var(--text-3); }
.cal-bar.exam { background: var(--danger); }
.cal-bar.intern { background: var(--ok); }
.cal-ev-main { min-width: 0; flex: 1; }
.cal-ev-title { font-size: 14px; font-weight: 500; }
.cal-ev-sub { font-size: 12px; color: var(--text-3); }

/* ---------- Noten ---------- */
.grade-subject {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}
.grade-subject-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.grade-avg-badge {
  margin-left: auto;
  font-size: 17px; font-weight: 700;
  padding: 3px 12px; border-radius: 11px;
  background: var(--accent-soft); color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.grade-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.grade-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 12px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  font-size: 13.5px;
}
.grade-chip b { font-variant-numeric: tabular-nums; }
.grade-chip .x { color: var(--text-3); line-height: 1; padding: 2px; border-radius: 6px; }
.grade-chip .x:hover { color: var(--danger); background: var(--danger-soft); }
.grade-chip .lbl { color: var(--text-3); font-size: 12px; }

.overall-card {
  background: linear-gradient(150deg, var(--accent), var(--accent-press));
  color: #fff;
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 18px;
}
.overall-card .big { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.overall-card .lbl { font-size: 13px; opacity: 0.9; }
.overall-card .lbl b { display: block; font-size: 15px; opacity: 1; font-weight: 600; margin-bottom: 2px; }

/* Punkte-Skala Farbe (dezent) */
.pts { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- Bilder ---------- */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
}
.img-cell {
  position: relative;
  aspect-ratio: 1;
  border-radius: 11px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  cursor: pointer;
}
.img-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-cell .rm {
  position: absolute; top: 5px; right: 5px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff; border: none;
  display: grid; place-items: center;
  backdrop-filter: blur(4px);
}
.img-cell .rm .ico { width: 13px; height: 13px; }

.uploader {
  border: 1.5px dashed var(--border);
  border-radius: 13px;
  padding: 18px;
  text-align: center;
  color: var(--text-3);
  font-size: 13.5px;
  transition: border 0.15s var(--ease), background 0.15s var(--ease);
  cursor: pointer;
}
.uploader:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.uploader .ico { width: 22px; height: 22px; margin-bottom: 6px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.34);
  backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
.modal-backdrop.in { opacity: 1; }
.modal {
  background: var(--surface);
  width: 100%;
  max-width: 540px;
  max-height: 92vh;
  border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column;
  transform: translateY(24px);
  transition: transform 0.24s var(--ease);
  overflow: hidden;
}
.modal.wide { max-width: 760px; }
.modal-backdrop.in .modal { transform: translateY(0); }
.modal-head {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border-2);
  flex: none;
}
.modal-head h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.modal-head .close { margin-left: auto; }
.modal-body { padding: 18px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 20px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border-2);
  flex: none;
  background: var(--surface);
}

/* ---------- Formularfelder ---------- */
.field { margin-bottom: 15px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
}
.field .hint { font-weight: 400; color: var(--text-3); }
.input, .textarea, .select {
  width: 100%;
  padding: 10px 13px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  outline: none;
  transition: border 0.15s var(--ease), box-shadow 0.15s var(--ease);
  -webkit-appearance: none;
  appearance: none;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--accent-line);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background: var(--surface);
}
.textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
.select {

/* ---------- Toast ---------- */
.toast-wrap {
  position: fixed; left: 0; right: 0;

  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 200; pointer-events: none;
}
.toast {
  background: var(--text);
  color: var(--bg);
  padding: 11px 18px;
  border-radius: 13px;
  font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-pop);
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
}

/* ---------- Lightbox ---------- */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex; align-items: center; justify-content: center;

  position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.16); color: #fff; border: none;

  <script>
/* =========================================================================
   FOS Dashboard – app.js  ·  V2
   Vanilla JS · IndexedDB · lokal · offline-fähig
   Entitäten: subjects, tasks, exams, grades, appointments,
              internshipSites, internship (Tage), images

            Praktikum als Hierarchie Stelle → Tag → Bericht/Bilder.
   ========================================================================= */

'use strict';

/* -------------------------------------------------------------------------
   0 · Icons (inline SVG)
   ------------------------------------------------------------------------- */
const ICONS = {
  grid:      '<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>',

  book:      '<path d="M4 5A2.5 2.5 0 0 1 6.5 2.5H20v16.5H6.5A2.5 2.5 0 0 0 4 21.5z"/><line x1="8" y1="7.5" x2="16" y2="7.5"/>',

  check:     '<polyline points="20 6 9 17 4 12"/>',
  x:         '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  image:     '<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15.5 15.5 10 5 20.5"/>',
  trash:     '<polyline points="3 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  pencil:    '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  clock:     '<circle cx="12" cy="12" r="9"/><polyline points="12 7.5 12 12.2 15 14"/>',
  sun:       '<circle cx="12" cy="12" r="4"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.8" y1="4.8" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.2" y2="19.2"/><line x1="19.2" y1="4.8" x2="17.4" y2="6.6"/><line x1="6.6" y1="17.4" x2="4.8" y2="19.2"/>',
  moon:      '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  inbox:     '<path d="M22 12h-5.5l-1.8 2.6H9.3L7.5 12H2"/><path d="M5.4 5.2h13.2l3 6.8v6a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1v-6z"/>',
  upload:    '<path d="M12 15.5V3.5"/><polyline points="7.5 8 12 3.5 16.5 8"/><path d="M5 20.5h14"/>',

  camera:    '<path d="M4 8.5a2 2 0 0 1 2-2h1.5l1.3-2h6.4l1.3 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/>',
};
function icon(name, cls = 'ico') {

/* -------------------------------------------------------------------------
   1 · Utilities
   ------------------------------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function todayISO() { return dateToISO(new Date()); }
function dateToISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysUntil(iso) { return Math.round((parseISO(iso) - startOfToday()) / 86400000); }

const fmtHeader = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtWeekday = new Intl.DateTimeFormat('de-DE', { weekday: 'long' });
const fmtLong = new Intl.DateTimeFormat('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });

function fmtShort(iso) { const d = parseISO(iso); return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`; }
function relDayName(iso) {
  const n = daysUntil(iso);
  if (n === 0) return 'Heute';
  if (n === 1) return 'Morgen';
  if (n === -1) return 'Gestern';
  return fmtWeekday.format(parseISO(iso));
}

/* Fristen-Logik: >4 Tage normal · ≤4 gelb · ≤2 rot · überfällig markiert */
function dueMeta(iso, time) {
  if (!iso) return { n: null, cls: '', label: '' };
  const n = daysUntil(iso);
  const t = time ? ` · ${time}` : '';
  if (n < 0) return { n, cls: 'over', label: n === -1 ? 'Gestern fällig' : `${-n} Tage überfällig` };
  if (n === 0) return { n, cls: 'danger', label: `Heute${t}` };
  if (n === 1) return { n, cls: 'danger', label: `Morgen${t}` };
  if (n <= 2) return { n, cls: 'danger', label: `in ${n} Tagen` };
  if (n <= 4) return { n, cls: 'warn', label: `in ${n} Tagen` };
  return { n, cls: '', label: fmtShort(iso) };
}

/* -------------------------------------------------------------------------
   2 · IndexedDB
   ------------------------------------------------------------------------- */
const DB_NAME = 'fos_dashboard';
const DB_VERSION = 2;
/* V2: 'internshipSites' neu. Reihenfolge egal – Laden ist key-basiert.
   Versions-Bump legt fehlende Stores an, bestehende Daten bleiben erhalten. */
const STORES = ['subjects', 'tasks', 'exams', 'grades', 'appointments', 'internshipSites', 'internship', 'images'];
let _db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach((s) => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
    };
    req.onsuccess = (e) => { _db = e.target.result; res(_db); };
    req.onerror = (e) => rej(e.target.error);
  });
}
function dbAll(store) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, 'readonly').objectStore(store).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(store, val) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, 'readwrite').objectStore(store).put(val);
    r.onsuccess = () => res(val);
    r.onerror = () => rej(r.error);
  });
}
function dbDel(store, id) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, 'readwrite').objectStore(store).delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

/* -------------------------------------------------------------------------
   3 · Bilder: dekodieren, skalieren, komprimieren (WebP → JPEG-Fallback)
   ------------------------------------------------------------------------- */
async function decodeImage(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) {}
    try { return await createImageBitmap(file); } catch (_) {}
  }
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { res(im); };
    im.onerror = () => rej(new Error('decode'));
    im.src = url;
  });
}
function canvasToBlob(canvas, q) {
  return new Promise((res) => {
    canvas.toBlob((b) => {
      if (b && b.type === 'image/webp') return res(b);
      canvas.toBlob((j) => res(j || b), 'image/jpeg', q);
    }, 'image/webp', q);
  });
}
async function scaleToBlob(src, maxDim, q) {
  const sw = src.width, sh = src.height;
  const scale = Math.min(1, maxDim / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * scale));
  const h = Math.max(1, Math.round(sh * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(src, 0, 0, w, h);
  return canvasToBlob(c, q);
}
async function processImage(file) {
  const src = await decodeImage(file);
  const blob = await scaleToBlob(src, 1600, 0.82);   // Ansichts-Version
  const thumb = await scaleToBlob(src, 480, 0.72);   // Vorschau
  if (src.close) src.close();
  return { blob, thumb, size: blob.size + thumb.size };
}
function bytesToStr(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
}

/* -------------------------------------------------------------------------
   4 · State
   ------------------------------------------------------------------------- */
const state = {
  view: 'dashboard',
  internView: null, // { siteId } → Detailansicht einer Praktikumsstelle, sonst Liste
  subjects: [], tasks: [], exams: [], grades: [], appointments: [],
  internshipSites: [], internship: [], images: [],
};
const objUrls = new Map(); // id -> objectURL (Vorschauen)

function thumbUrl(imgRec) {
  if (objUrls.has(imgRec.id)) return objUrls.get(imgRec.id);
  const u = URL.createObjectURL(imgRec.thumb || imgRec.blob);
  objUrls.set(imgRec.id, u);
  return u;
}
async function loadAll() {
  const results = await Promise.all(STORES.map((s) => dbAll(s)));
  STORES.forEach((s, i) => { state[s] = results[i]; });
  state.subjects.sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
async function reload(store) {
  state[store] = await dbAll(store);
  if (store === 'subjects') state.subjects.sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
function subjectName(id) { const s = state.subjects.find((x) => x.id === id); return s ? s.name : '—'; }
function siteName(id) { const s = state.internshipSites.find((x) => x.id === id); return s ? s.name : 'Praktikum'; }
function daysForSite(id) { return state.internship.filter((n) => n.siteId === id); }
function imagesFor(type, id) { return state.images.filter((im) => im.relatedItemType === type && im.relatedItemId === id); }

/* V2-Datennetzwerk: Klausur ↔ Note.
   Die Note mit examId ist die einzige Quelle für das Klausurergebnis –
   dadurch fließt ein Klausurergebnis automatisch in Fach- und Gesamtschnitt. */
function gradeForExam(examId) { return state.grades.find((g) => g.examId === examId) || null; }
function examResult(examId) { const g = gradeForExam(examId); return g ? g.points : null; }
/* Klausurergebnis schreiben/aktualisieren/entfernen (eine Note pro Klausur). */
async function setExamResult(exam, points) {
  const existing = gradeForExam(exam.id);
  if (points == null) { if (existing) await dbDel('grades', existing.id); return; }
  await dbPut('grades', {
    id: existing ? existing.id : uid(),
    subjectId: exam.subjectId,
    examId: exam.id,
    points,
    label: exam.title || 'Klausur',
    kind: 'exam',
    date: exam.date || todayISO(),
    createdAt: existing?.createdAt || Date.now(),
  });
}

/* -------------------------------------------------------------------------
   5 · Toast / Modal / Confirm / Lightbox
   ------------------------------------------------------------------------- */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('#toastWrap').appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 220); }, 2100);
}

function openModal({ title, wide = false }) {
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `
    <div class="modal ${wide ? 'wide' : ''}">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn close" data-close aria-label="Schließen">${icon('x')}</button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div>
    </div>`;
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add('in'));
  const close = () => { back.classList.remove('in'); setTimeout(() => back.remove(), 240); };
  back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) close(); });
  return { el: back, body: $('.modal-body', back), foot: $('.modal-foot', back), close };
}

function confirmDialog(message, { danger = true, okLabel = 'Löschen' } = {}) {
  return new Promise((resolve) => {
    const m = openModal({ title: 'Bestätigen' });
    m.body.innerHTML = `<p style="color:var(--text-2);line-height:1.5">${esc(message)}</p>`;
    m.foot.innerHTML = `
      <button class="btn ghost" data-no>Abbrechen</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button>`;
    $('[data-no]', m.el).onclick = () => { m.close(); resolve(false); };
    $('[data-yes]', m.el).onclick = () => { m.close(); resolve(true); };
  });
}

function openLightbox(imgRec) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  const url = URL.createObjectURL(imgRec.blob);
  lb.innerHTML = `<button class="lb-close" aria-label="Schließen">${icon('x')}</button><img src="${url}" alt="">`;
  document.body.appendChild(lb);
  requestAnimationFrame(() => lb.classList.add('in'));
  const close = () => { lb.classList.remove('in'); setTimeout(() => { lb.remove(); URL.revokeObjectURL(url); }, 220); };
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.closest('.lb-close')) close(); });
}

/* -------------------------------------------------------------------------
   6 · Bild-Editor für Formulare (mehrere Uploads, Vorschau, Entfernen)
   ------------------------------------------------------------------------- */
function mountImageEditor(host, existing = []) {
  const model = { keep: existing.slice(), add: [] }; // add: {id, blob, thumb, url, size}
  host.innerHTML = `
    <div class="img-grid" data-imggrid></div>
    <label class="uploader" style="margin-top:10px;display:block">
      ${icon('camera')}<div>Bilder hinzufügen · Kamera oder Galerie</div>
      <input type="file" accept="image/*" multiple hidden data-imgfile>
    </label>
    <div class="stat-sub" data-imgnote style="margin-top:8px"></div>`;
  const grid = $('[data-imggrid]', host);
  const note = $('[data-imgnote]', host);
  const file = $('[data-imgfile]', host);

  function draw() {
    const cells = [];
    model.keep.forEach((r) => cells.push(cell(thumbUrl(r), r.id, 'keep')));
    model.add.forEach((a) => cells.push(cell(a.url, a.id, 'add')));
    grid.innerHTML = cells.join('') || `<div class="stat-sub">Noch keine Bilder.</div>`;
    const total = model.add.reduce((s, a) => s + a.size, 0);
    note.textContent = total ? `${model.add.length} neu · ${bytesToStr(total)} (komprimiert)` : '';
  }
  function cell(url, id, kind) {
    return `<div class="img-cell" data-open="${id}" data-kind="${kind}">
      <img src="${url}" alt="" loading="lazy">
      <button class="rm" data-rm="${id}" data-kind="${kind}" aria-label="Entfernen">${icon('x')}</button>
    </div>`;
  }
  grid.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      e.stopPropagation();
      const id = rm.dataset.rm;
      if (rm.dataset.kind === 'add') {
        const i = model.add.findIndex((a) => a.id === id);
        if (i > -1) { URL.revokeObjectURL(model.add[i].url); model.add.splice(i, 1); }
      } else {
        model.keep = model.keep.filter((r) => r.id !== id);
      }
      draw();
      return;
    }
    const op = e.target.closest('[data-open]');
    if (op && op.dataset.kind === 'keep') {
      const r = model.keep.find((x) => x.id === op.dataset.open);
      if (r) openLightbox(r);
    }
  });
  file.addEventListener('change', async (e) => {
    const files = [...e.target.files];
    file.value = '';
    note.textContent = 'Optimiere Bilder…';
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      try {
        const p = await processImage(f);
        model.add.push({ id: uid(), blob: p.blob, thumb: p.thumb, size: p.size, url: URL.createObjectURL(p.thumb) });
      } catch (_) { toast('Ein Bild konnte nicht geladen werden.'); }
    }
    draw();
  });
  draw();

  return {
    async persist(relatedItemType, relatedItemId, meta) {
      const keptIds = new Set(model.keep.map((r) => r.id));
      for (const r of existing) if (!keptIds.has(r.id)) await dbDel('images', r.id);
      for (const a of model.add) {
        await dbPut('images', {
          id: a.id, blob: a.blob, thumb: a.thumb,
          category: meta.category || 'Sonstiges',
          subjectId: meta.subjectId || null,
          date: meta.date || todayISO(),
          title: meta.title || '',
          relatedItemType, relatedItemId,
          size: a.size, createdAt: Date.now(),
        });
      }
    },
  };
}

/* -------------------------------------------------------------------------

   ------------------------------------------------------------------------- */
function subjectOptions(selected, includeEmpty = true) {
  let html = includeEmpty ? `<option value="">Kein Fach</option>` : '';
  html += state.subjects.map((s) => `<option value="${s.id}" ${s.id === selected ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  return html;
}
function ptsPicker(name, selected) {
  let html = `<div class="pts-picker" data-pts="${name}">`;
  for (let i = 0; i <= 15; i++) {
    html += `<button type="button" class="pts-btn ${i === selected ? 'on' : ''}" data-val="${i}">${i}</button>`;
  }
  html += `</div><input type="hidden" data-ptsval="${name}" value="${selected ?? ''}">`;
  return html;
}
function wirePtsPicker(root) {
  $$('.pts-picker', root).forEach((pk) => {
    pk.addEventListener('click', (e) => {
      const b = e.target.closest('.pts-btn'); if (!b) return;
      $$('.pts-btn', pk).forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      const hidden = $(`[data-ptsval="${pk.dataset.pts}"]`, root);
      if (hidden) hidden.value = b.dataset.val;
    });
  });
}

/* -------------------------------------------------------------------------
   9 · Noten-Berechnung
   ------------------------------------------------------------------------- */
function subjectAverage(subjectId) {
  const g = state.grades.filter((x) => x.subjectId === subjectId);
  if (!g.length) return null;
  return g.reduce((s, x) => s + x.points, 0) / g.length;
}
function overallAverage() {
  const avgs = state.subjects.map((s) => subjectAverage(s.id)).filter((a) => a !== null);
  if (!avgs.length) return null;
  return avgs.reduce((s, a) => s + a, 0) / avgs.length;
}
function fmtAvg(a) { return a === null ? '–' : a.toFixed(2).replace('.', ','); }

  return `<div class="empty">${icon('inbox', 'ico')}<p>${esc(text)}</p>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;
}

/* --- Aufgaben --- */
function renderTasks() {
  const sorted = [...state.tasks].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return b.createdAt - a.createdAt;
  });
  const open = sorted.filter((t) => !t.done);
  const done = sorted.filter((t) => t.done);

  $('#view').innerHTML = `
    <div class="page-head">
      <div><div class="page-title">Aufgaben</div><div class="page-sub">${open.length} offen · ${done.length} erledigt</div></div>
      <button class="btn primary" data-act="newTask">${icon('plus')} Aufgabe</button>
    </div>
    ${open.length ? `<div class="rows">${open.map(taskRow).join('')}</div>` : emptyBlock('Keine offenen Aufgaben.', 'Tippe oben rechts auf „Aufgabe“.')}
    ${done.length ? `<div class="section-label">Erledigt</div><div class="rows">${done.map(taskRow).join('')}</div>` : ''}`;
}
function taskRow(t) {
  const meta = t.done ? { cls: '', label: '' } : dueMeta(t.dueDate, t.dueTime);
  const imgs = imagesFor('task', t.id).length;
  return `<div class="row ${meta.cls === 'over' ? 'overdue' : ''}">
    <button class="check ${t.done ? 'on' : ''}" data-act="toggleTask:${t.id}" aria-label="Erledigt umschalten">${icon('check')}</button>
    <div class="row-main" data-act="openTask:${t.id}">
      <div class="row-title ${t.done ? 'done' : ''}">${esc(t.title)}</div>
      <div class="row-meta">
        ${t.subjectId ? `<span>${esc(subjectName(t.subjectId))}</span>` : ''}
        ${t.description ? `<span>· ${esc(t.description.slice(0, 60))}</span>` : ''}
      </div>
    </div>
    <div class="row-end" data-act="openTask:${t.id}">
      ${imgs ? `<span class="thumb-count">${icon('image')}${imgs}</span>` : ''}
      ${!t.done && t.dueDate ? `<span class="due ${meta.cls}">${esc(meta.label)}</span>` : ''}
    </div>
  </div>`;
}

/* --- Kalender --- */
function renderCalendar() {
  const days = [];
  for (let i = 0; i < 21; i++) {
    const d = new Date(startOfToday()); d.setDate(d.getDate() + i);
    const iso = dateToISO(d);
    const events = [];
    state.tasks.filter((t) => !t.done && t.dueDate === iso).forEach((t) => events.push({ type: 'task', time: t.dueTime || '', title: t.title, sub: t.subjectId ? subjectName(t.subjectId) : 'Aufgabe / Abgabe', act: `openTask:${t.id}` }));
    state.exams.filter((e) => e.date === iso).forEach((e) => events.push({ type: 'exam', time: e.time || '', title: e.title, sub: 'Klausur · ' + subjectName(e.subjectId), act: `openExam:${e.id}` }));
    state.appointments.filter((a) => a.date === iso).forEach((a) => events.push({ type: 'appt', time: a.time || '', title: a.title, sub: 'Termin', act: `openAppt:${a.id}` }));
    state.internship.filter((n) => n.date === iso).forEach((n) => events.push({ type: 'intern', time: '', title: 'Praktikum · ' + siteName(n.siteId), sub: n.report ? n.report.slice(0, 50) : 'Tagesbericht', act: `openIntern:${n.id}` }));
    events.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    if (events.length || i <= 1) days.push({ iso, d, events });
  }
  const hasAny = days.some((x) => x.events.length);

  $('#view').innerHTML = `
    <div class="page-head">
      <div><div class="page-title">Kalender</div><div class="page-sub">Nächste Tage im Überblick</div></div>
      <button class="btn primary" data-act="newAppt">${icon('plus')} Termin</button>
    </div>
    ${hasAny || days.length ? days.map((day) => `
      <div class="cal-day ${daysUntil(day.iso) === 0 ? 'is-today' : ''}">
        <div class="cal-day-head">
          <span class="cal-day-name">${esc(relDayName(day.iso))}</span>
          <span class="cal-day-date">${esc(fmtLong.format(day.d))}</span>
        </div>
        ${day.events.length ? day.events.map((e) => `
          <div class="cal-event mini-row click" data-act="${e.act}">
            <span class="cal-time">${esc(e.time || '–')}</span>
            <span class="cal-bar ${e.type}"></span>
            <div class="cal-ev-main"><div class="cal-ev-title">${esc(e.title)}</div><div class="cal-ev-sub">${esc(e.sub)}</div></div>
          </div>`).join('') : `<div class="cal-ev-sub" style="padding:4px 4px 8px">Nichts geplant.</div>`}
      </div>`).join('') : emptyBlock('Keine Einträge in den nächsten Tagen.')}`;
}

/* --- Klausuren --- */
function renderExams() {
  const sorted = [...state.exams].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const upcoming = sorted.filter((e) => e.date && daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  const past = sorted.filter((e) => !e.date || daysUntil(e.date) < 0);

  $('#view').innerHTML = `
    <div class="page-head">
      <div><div class="page-title">Klausuren</div><div class="page-sub">${upcoming.length} anstehend</div></div>
      <button class="btn primary" data-act="newExam">${icon('plus')} Klausur</button>
    </div>
    ${upcoming.length ? `<div class="rows">${upcoming.map(examRow).join('')}</div>` : emptyBlock('Keine anstehenden Klausuren.')}
    ${past.length ? `<div class="section-label">Vergangen</div><div class="rows">${past.map(examRow).join('')}</div>` : ''}`;
}
function examRow(e) {
  const meta = e.date ? dueMeta(e.date, e.time) : { cls: '', label: '' };
  const imgs = imagesFor('exam', e.id).length;
  const past = e.date && daysUntil(e.date) < 0;
  const result = examResult(e.id);
  let end;
  if (result != null) end = `<span class="grade-avg-badge" style="font-size:14px">${result} P</span>`;
  else if (past) end = `<span class="tag-muted">nicht bewertet</span>`;
  else end = `<span class="due ${meta.cls}">${esc(relDayName(e.date))}</span>`;
  return `<div class="row" data-act="openExam:${e.id}">
    <span class="cal-bar exam" style="width:4px;height:34px;border-radius:3px"></span>
    <div class="row-main">
      <div class="row-title">${esc(e.title)} · ${esc(subjectName(e.subjectId))}</div>
      <div class="row-meta">${e.date ? esc(fmtLong.format(parseISO(e.date))) : 'ohne Datum'}${e.time ? ' · ' + esc(e.time) : ''}</div>
    </div>
    <div class="row-end">
      ${imgs ? `<span class="thumb-count">${icon('image')}${imgs}</span>` : ''}
      ${end}
    </div>
  </div>`;
}

/* --- Noten --- */
function renderGrades() {
  const overall = overallAverage();
  const rated = state.subjects.filter((s) => subjectAverage(s.id) !== null).length;

  $('#view').innerHTML = `
    <div class="page-head">
      <div><div class="page-title">Noten</div><div class="page-sub">FOS-Punktesystem · 0–15</div></div>
      <button class="btn primary" data-act="newGrade">${icon('plus')} Note</button>
    </div>
    <div class="overall-card">
      <div class="big">${fmtAvg(overall)}</div>
      <div class="lbl"><b>Gesamtdurchschnitt</b>${rated} von ${state.subjects.length} Fächern bewertet</div>
    </div>
    ${state.subjects.length ? state.subjects.map(gradeSubjectBlock).join('') : emptyBlock('Noch keine Fächer.', 'Lege zuerst unter „Fächer“ ein Fach an.')}`;
}

function byId(store, id) { return state[store].find((x) => x.id === id); }

async function handleAction(act) {
  const [cmd, arg] = act.split(':');
  switch (cmd) {
    case 'newTask': return openTaskForm();
    case 'newExam': return openExamForm();
    case 'newGrade': return openGradeForm();
    case 'newAppt': return openAppointmentForm();
    case 'newIntern': return openInternshipForm();
    case 'newSubject': return openSubjectForm();
    case 'newGradeFor': return openGradeForm(null, arg);
    case 'goto': return navigate(arg);
    case 'gallery': return openGallery();
    case 'newSite': return openInternshipSiteForm();
    case 'editSite': return openInternshipSiteForm(byId('internshipSites', arg));
    case 'openSite': return openSiteDetail(arg);
    case 'internList': { state.internView = null; render(); return; }
    case 'newDayFor': return openInternshipForm(null, arg);
    case 'exportData': return exportBackup();
    case 'importData': return importBackupPrompt();
    case 'openTask': return openTaskForm(byId('tasks', arg));
    case 'openExam': return openExamForm(byId('exams', arg));
    case 'openAppt': return openAppointmentForm(byId('appointments', arg));
    case 'openIntern': return openInternshipForm(byId('internship', arg));
    case 'editGrade': return openGradeForm(byId('grades', arg));
    case 'editSubject': return openSubjectForm(byId('subjects', arg));
    case 'lightbox': { const im = byId('images', arg); if (im) openLightbox(im); return; }
    case 'toggleTask': {
      const t = byId('tasks', arg);
      if (t) { t.done = !t.done; await dbPut('tasks', t); await reload('tasks'); render(); }
      return;
    }
    case 'delSubject': {
      const s = byId('subjects', arg);
      if (!s) return;
      if (await confirmDialog(`„${s.name}“ löschen? Zugehörige Noten werden entfernt; Aufgaben/Klausuren verlieren die Fach-Zuordnung.`)) {
        for (const g of state.grades.filter((x) => x.subjectId === s.id)) await dbDel('grades', g.id);
        for (const t of state.tasks.filter((x) => x.subjectId === s.id)) { t.subjectId = null; await dbPut('tasks', t); }
        for (const e of state.exams.filter((x) => x.subjectId === s.id)) { e.subjectId = null; await dbPut('exams', e); }
        await dbDel('subjects', s.id);
        await Promise.all([reload('subjects'), reload('grades'), reload('tasks'), reload('exams')]);
        render(); toast('Fach gelöscht');
      }
      return;
    }
  }
}

/* V1 → V2 Migration (additiv, zerstörungsfrei):
   1. Praktikumstage aus V1 hatten keine siteId → einer automatisch angelegten
      Sammel-Stelle „Mein Praktikum“ zuordnen, damit sie sichtbar bleiben.
   2. V1-Klausuren mit direkt gespeicherten Punkten (exam.points) → in die
      verknüpfte Note überführen, damit sie in Fach-/Gesamtschnitt zählen.
   Es wird nichts gelöscht und nichts dupliziert. */
async function migrateData() {
  let touchedSites = false, touchedDays = false, touchedGrades = false;

  const orphanDays = state.internship.filter((n) => !n.siteId);
  if (orphanDays.length) {
    let bucket = state.internshipSites.find((s) => s.migratedDefault);
    if (!bucket) {
      bucket = {
        id: uid(), name: 'Mein Praktikum', kind: '', address: '',
        contact: '', phone: '', email: '', periodStart: null, periodEnd: null,
        note: 'Automatisch aus früheren Einträgen angelegt. Du kannst sie umbenennen.',
        migratedDefault: true, createdAt: Date.now(),
      };
      await dbPut('internshipSites', bucket);
      touchedSites = true;
    }
    for (const n of orphanDays) { n.siteId = bucket.id; await dbPut('internship', n); }
    touchedDays = true;
  }

  for (const ex of state.exams) {
    if (ex.points != null && !gradeForExam(ex.id)) {
      await setExamResult(ex, ex.points);
      touchedGrades = true;
    }
  }

  const jobs = [];
  if (touchedSites) jobs.push(reload('internshipSites'));
  if (touchedDays) jobs.push(reload('internship'));
  if (touchedGrades) jobs.push(reload('grades'));
  if (jobs.length) await Promise.all(jobs);
}

/* ---- Lokales Backup: Export / Import (JSON, inkl. Bilder als Data-URL) ---- */
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataURL) {
  const [head, b64] = dataURL.split(',');
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function exportBackup() {
  try {
    toast('Sicherung wird erstellt …');
    const data = { app: 'fos-dashboard', version: DB_VERSION, exportedAt: new Date().toISOString(), stores: {} };
    for (const s of STORES) {
      const rows = await dbAll(s);
      if (s === 'images') {
        data.stores[s] = await Promise.all(rows.map(async (r) => ({
          ...r,
          blob: await blobToDataURL(r.blob),
          thumb: r.thumb ? await blobToDataURL(r.thumb) : null,
        })));
      } else {
        data.stores[s] = rows;
      }
    }
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fos-dashboard-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Sicherung gespeichert');
  } catch (err) { console.error(err); toast('Sicherung fehlgeschlagen'); }
}
function importBackupPrompt() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !data.stores) { toast('Ungültige Sicherungsdatei'); return; }
      const count = Object.values(data.stores).reduce((n, arr) => n + (Array.isArray(arr) ? arr.length : 0), 0);
      const ok = await confirmDialog(
        `${count} Einträge aus der Sicherung übernehmen? Einträge mit gleicher ID werden aktualisiert – es wird nichts gelöscht.`,
        { danger: false, okLabel: 'Importieren' }
      );
      if (!ok) return;
      toast('Import läuft …');
      for (const s of STORES) {
        const rows = data.stores[s];
        if (!Array.isArray(rows)) continue;
        for (const r of rows) {
          if (s === 'images') {
            const rec = { ...r };
            if (typeof rec.blob === 'string') rec.blob = dataURLToBlob(rec.blob);
            if (typeof rec.thumb === 'string') rec.thumb = dataURLToBlob(rec.thumb);
            await dbPut('images', rec);
          } else {
            await dbPut(s, r);
          }
        }
      }
      await loadAll();
      await migrateData();
      render();
      toast('Sicherung importiert');
    } catch (err) { console.error(err); toast('Import fehlgeschlagen'); }
  };
  input.click();
}

function bindGlobalEvents() {
  // Aktionen im Hauptbereich + Sidebar-Foot
  document.body.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { navigate(nav.dataset.nav); return; }
    const searchRes = e.target.closest('[data-searchres]');
    if (searchRes) { const act = searchRes.dataset.act; closeSearch(); handleAction(act); return; }
    // Aktionen außerhalb von Modals (Modals verdrahten ihre Buttons direkt);
    // Suchergebnisse wurden oben bereits behandelt.
    const actEl = e.target.closest('[data-act]');
    if (actEl && !actEl.closest('.modal')) { e.preventDefault(); handleAction(actEl.dataset.act); return; }
  });

  $('#btnMenu').addEventListener('click', toggleMenu);
  $('#overlay').addEventListener('click', closeMenu);
  $('#btnTheme').addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  const si = $('#searchInput');
  let searchT;
  si.addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(() => runSearch(si.value), 120); });
  si.addEventListener('focus', () => { if (si.value) runSearch(si.value); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#searchWrap')) { const p = $('#searchPanel'); if (p) p.remove(); }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const lb = $('.lightbox'); if (lb) { lb.click(); return; }
      const mb = $('.modal-backdrop'); if (mb) { mb.click(); return; }
      closeMenu(); closeSearch();
    }
  });

  window.addEventListener('hashchange', () => {
    const v = location.hash.replace('#', '');
    if (VIEWS[v] && v !== state.view) { state.view = v; render(); }
  });
}

async function init() {
  initTheme();
  $('#headDate').textContent = fmtHeader.format(new Date());
  try {
    await openDB();
    await loadAll();
    await seedIfEmpty();
    await migrateData();
  } catch (err) {
    $('#view').innerHTML = emptyBlock('Speicher konnte nicht geöffnet werden.', 'Bitte im Browser den privaten Modus deaktivieren und neu laden.');
    console.error(err);
    return;
  }
  const startView = location.hash.replace('#', '');
  if (VIEWS[startView]) state.view = startView;
  bindGlobalEvents();
  render();
}

document.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
